name: 功能请求
description: 提出一个新功能或改进建议
title: "[Feature] "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: 需求背景
      description: 这个功能要解决什么问题？
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: 期望方案
      description: 你希望它如何工作？
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 备选方案
      description: 你考虑过的其他做法（可选）
    validations:
      required: false
  - type: checkboxes
    id: acknowledgements
    attributes:
      label: 确认
      options:
        - label: 我已搜索现有 Issue，确认这不是重复请求。
          required: true
