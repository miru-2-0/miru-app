name: Bug 报告
description: 报告一个可复现的问题
title: "[Bug] "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈！请尽量填写以下信息，便于定位问题。
  - type: textarea
    id: what-happened
    attributes:
      label: 问题描述
      description: 清晰描述发生了什么，以及你期望的结果。
    validations:
      required: true
  - type: textarea
    id: reproduce-steps
    attributes:
      label: 复现步骤
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: 平台
      options:
        - Windows
        - macOS
        - Linux
        - Android
        - iOS
    validations:
      required: true
  - type: input
    id: miru-version
    attributes:
      label: Miru 版本
      description: 可在「设置 → 关于应用」中查看
      placeholder: "例如 1.0.1"
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: 日志 / 截图
      description: 相关日志或截图（可直接拖拽上传）
    validations:
      required: false
  - type: checkboxes
    id: acknowledgements
    attributes:
      label: 确认
      options:
        - label: 我已搜索现有 Issue，确认这不是重复问题。
          required: true
