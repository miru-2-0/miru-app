name: build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    name: build-${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows
            os: windows-latest
            artifact: miru-windows-x64.zip
            name: Windows x64
            asset: build/windows/x64/runner/Release
            package: ''
            zip: false
          - platform: android
            os: ubuntu-latest
            artifact: miru-android.apk
            name: Android APK
            asset: build/app/outputs/flutter-apk/app-release.apk
            package: ''
            zip: false
          - platform: macos
            os: macos-latest
            artifact: miru-macos.zip
            name: macOS
            asset: build/macos/Build/Products/Release
            package: miru.app
            zip: true
          - platform: linux
            os: ubuntu-latest
            artifact: miru-linux-x64.tar.gz
            name: Linux x64
            asset: build/linux/x64/release/bundle
            package: ''
            zip: false
          - platform: ios
            os: macos-latest
            artifact: miru-ios.zip
            name: iOS (no-codesign)
            asset: build/ios/iphoneos
            package: Runner.app
            zip: true

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Enable desktop
        run: flutter config --enable-windows-desktop --enable-macos-desktop --enable-linux-desktop

      - name: Install Linux dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update -y
          sudo apt-get install -y ninja-build libgtk-3-dev libmpv-dev mpv

      - name: Install dependencies
        run: flutter pub get

      - name: Build Windows
        if: matrix.platform == 'windows'
        run: flutter build windows --release

      - name: Build Android
        if: matrix.platform == 'android'
        run: flutter build apk --release

      - name: Build macOS
        if: matrix.platform == 'macos'
        run: flutter build macos --release

      - name: Build Linux
        if: matrix.platform == 'linux'
        run: flutter build linux --release

      - name: Build iOS (no codesign)
        if: matrix.platform == 'ios'
        run: flutter build ios --release --no-codesign

      - name: Package Windows
        if: matrix.platform == 'windows'
        shell: pwsh
        run: Compress-Archive -Path '${{ matrix.asset }}' -DestinationPath '${{ matrix.artifact }}' -Force

      - name: Package Android
        if: matrix.platform == 'android'
        shell: bash
        run: |
          apk=$(find build/app/outputs/flutter-apk -name '*.apk' -type f | head -n 1)
          if [ -z "$apk" ]; then
            echo "未找到 APK 产物" >&2
            exit 1
          fi
          cp "$apk" "${{ matrix.artifact }}"

      - name: Package macOS
        if: matrix.package != ''
        shell: bash
        run: (cd '${{ matrix.asset }}' && zip -r -q "$GITHUB_WORKSPACE/${{ matrix.artifact }}" '${{ matrix.package }}')

      - name: Package Linux
        if: matrix.platform == 'linux'
        shell: bash
        run: tar -C '${{ matrix.asset }}' -czf "$GITHUB_WORKSPACE/${{ matrix.artifact }}" .

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}
          if-no-files-found: error

  release:
    name: release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate release notes
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME}"
          PREV_TAG=$(git describe --tags --abbrev=0 "${TAG}^" 2>/dev/null || true)
          {
            echo "## 更新内容"
            echo ""
            if [ -z "${PREV_TAG}" ]; then
              echo "首次发布，以下为全部提交："
              echo ""
              git log --no-merges --pretty=format:"- %s (%h)" "${TAG}"
              echo ""
            else
              git log --no-merges --pretty=format:"- %s (%h)" "${PREV_TAG}..${TAG}"
              echo ""
            fi
          } > RELEASE_NOTES.md
          echo "release-notes-file=RELEASE_NOTES.md" >> "${GITHUB_OUTPUT}"
        id: notes

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*/*
          tag_name: ${{ github.ref_name }}
          name: miru ${{ github.ref_name }}
          body_path: ${{ steps.notes.outputs.release-notes-file }}
          draft: false